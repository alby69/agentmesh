[project]
name = "agentmesh-llm"
version = "0.1.0"
description = "Unified LLM providers for AgentMesh"
authors = [{ name = "AgentMesh Contributors" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=1.14.0",
    "openai>=1.0.0",
    "anthropic>=0.45.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentmesh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
