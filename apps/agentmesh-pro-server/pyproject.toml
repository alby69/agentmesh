[project]
name = "agentmesh-pro-server"
version = "0.1.0"
description = "AgentMesh Pro REST API Server"
requires-python = ">=3.10"
dependencies = [
    "agentmesh-pro",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.uv.sources]
agentmesh-pro = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
