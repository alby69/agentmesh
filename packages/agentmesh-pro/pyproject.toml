[project]
name = "agentmesh-pro"
version = "0.1.0"
description = "Enterprise Multi-Agent Execution Framework for AgentMesh"
requires-python = ">=3.10"
dependencies = [
    "agentmesh-core",
    "agentmesh-llm",
    "agentmesh-relay",
    "agentmesh-vault",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.20",
    "litellm>=1.20.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "redis>=5.0.1",
    "langfuse>=2.0.0",
]

[tool.uv.sources]
agentmesh-core = { workspace = true }
agentmesh-llm = { workspace = true }
agentmesh-relay = { workspace = true }
agentmesh-vault = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agentmesh_pro"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
