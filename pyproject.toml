[project]
name = "agentmesh"
version = "0.1.0"
description = "AgentMesh: A coordination mesh for decentralized AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentMesh Contributors" }]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.20",
    "litellm>=1.20.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "redis>=5.0.1",
    "langfuse>=2.0.0",
]

[tool.uv]
workspace = { members = ["apps/*", "packages/*"] }

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pydantic-settings>=2.0.0",
    "pi-coding-agent",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/tests/**" = ["E402"]

[project.scripts]
agentmesh = "agentmesh.studio.main:app"

[tool.hatch.build.targets.wheel]
packages = ["packages/agentmesh-studio/agentmesh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
