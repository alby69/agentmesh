[project]
name = "econnet"
version = "0.1.0"
description = "Simulatore economico ad agenti (ABM) con AI — sistemi complessi, comportamento emergente, mercati riflessivi"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3.0",
]
all = [
    "torch>=2.3.0",
    "plotly>=5.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["econnet"]
