[project]
name = "motedico"
version = "0.1.0"
description = "Decentralized project collaboration and advisory mesh"
authors = [{ name = "AgentMesh Contributors" }]
requires-python = ">=3.10"
dependencies = [
    "agentmesh-core",
    "agentmesh-relay",
    "agentmesh-vault",
]

[tool.uv.sources]
agentmesh-core = { workspace = true }
agentmesh-relay = { workspace = true }
agentmesh-vault = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["motedico"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
