<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Newsletter Filter - AgentMesh{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- FontAwesome for beautiful icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        },
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Navbar -->
    <nav class="bg-slate-950 border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-brand-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-filter text-xl animate-pulse"></i>
                    </div>
                    <div>
                        <span class="font-black text-xl tracking-tight text-white">AgentMesh</span>
                        <span class="text-xs bg-slate-800 text-brand-500 font-semibold px-2 py-0.5 rounded-full ml-2">Newsletter Filter v4.0</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fa-solid fa-gauge mr-1"></i> Dashboard
                    </a>
                    <a href="#settings-modal" onclick="document.getElementById('settings-modal').classList.remove('hidden')" class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium bg-slate-800 border border-slate-700 hover:bg-slate-700">
                        <i class="fa-solid fa-gears mr-1"></i> Impostazioni
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-xs">
            <p>&copy; 2026 AgentMesh Network. AI-Native Cognitive Newsletter Filtering.</p>
        </div>
    </footer>
</body>
</html>
