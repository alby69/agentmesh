[project]
name = "agentmesh-vault"
version = "0.1.0"
description = "IPFS storage layer for AgentMesh"
authors = [{ name = "AgentMesh Contributors" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentmesh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
